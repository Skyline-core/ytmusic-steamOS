[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-steamOS"
version = "0.1.0"
description = "YouTube Music para Steam Deck / SteamOS Big Picture con MPRIS y UI táctil"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Skyline-core" }]
dependencies = [
    "PySide6>=6.6.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
linux = []

# MPRIS usa paquetes del sistema (no pip): python-dbus / python-gobject (Arch)
# o python3-dbus / python3-gi (Debian). Ver README.

[project.scripts]
ytmusic-steamOS = "ytmusic_decky.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ytmusic_decky*"]

[tool.setuptools.package-data]
ytmusic_decky = ["inject/*"]
