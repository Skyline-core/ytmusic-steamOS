name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage
        run: |
          chmod +x scripts/build-appimage.sh scripts/install-build-deps.sh packaging/AppRun \
            packaging/fix-bundle-libs.sh packaging/detect-ui-scale.sh packaging/setup-runtime-env.sh
          ./scripts/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytmusic-steamOS-x86_64.AppImage
          path: dist/ytmusic-steamOS-x86_64.AppImage
          if-no-files-found: error

      - name: Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ytmusic-steamOS-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
